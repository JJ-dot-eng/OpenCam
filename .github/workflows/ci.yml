name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Windows 빌드와 테스트
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 저장소 받기
        uses: actions/checkout@v4

      - name: Node.js 준비
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: 화면 의존성 설치
        run: npm ci

      - name: 화면 코드 타입 검사
        run: npx tsc --noEmit

      - name: 노드 테스트
        run: npm test

      - name: 화면 빌드
        run: npm run build

      - name: Rust 준비
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 빌드 캐시 준비
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: ffmpeg 설치와 확인
        run: |
          choco install ffmpeg -y --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ffmpeg -version

      - name: Rust 빌드
        working-directory: src-tauri
        run: cargo build --locked

      - name: Rust 테스트
        working-directory: src-tauri
        run: cargo test --locked
